<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#121827"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="panelGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGradient)"/>
  <circle cx="300" cy="200" r="250" fill="#22d3ee" opacity="0.15" filter="url(#glow)"/>
  <circle cx="1300" cy="750" r="300" fill="#a855f7" opacity="0.15" filter="url(#glow)"/>

  <!-- Resume Document (Left) -->
  <g filter="url(#shadow)">
    <rect x="120" y="180" width="480" height="540" rx="24" fill="#ffffff"/>
    <rect x="120" y="180" width="480" height="540" rx="24" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <g fill="#cbd5e1">
    <circle cx="200" cy="260" r="32" fill="#e2e8f0"/>
    <rect x="260" y="235" width="200" height="16" rx="8" fill="#0f172a"/>
    <rect x="260" y="265" width="150" height="10" rx="5" fill="#64748b"/>
    <rect x="260" y="285" width="180" height="10" rx="5" fill="#94a3b8"/>
    <rect x="160" y="350" width="100" height="12" rx="6" fill="#0f172a"/>
    <rect x="160" y="380" width="400" height="8" rx="4"/>
    <rect x="160" y="400" width="380" height="8" rx="4"/>
    <rect x="160" y="420" width="390" height="8" rx="4"/>
    <rect x="160" y="480" width="100" height="12" rx="6" fill="#0f172a"/>
    <rect x="160" y="510" width="400" height="8" rx="4"/>
    <rect x="160" y="530" width="350" height="8" rx="4"/>
    <rect x="160" y="550" width="370" height="8" rx="4"/>
    <rect x="160" y="610" width="100" height="12" rx="6" fill="#0f172a"/>
    <rect x="160" y="640" width="400" height="8" rx="4"/>
    <rect x="160" y="660" width="320" height="8" rx="4"/>
  </g>
  <rect x="160" y="690" width="80" height="10" rx="5" fill="url(#accentGradient)"/>
  <rect x="250" y="690" width="60" height="10" rx="5" fill="#22d3ee" opacity="0.7"/>

  <!-- AI Beam -->
  <path d="M 620 450 L 720 450" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 6"/>
  <circle cx="740" cy="450" r="12" fill="#22d3ee"/>
  <circle cx="740" cy="450" r="24" fill="#22d3ee" opacity="0.2"/>

  <!-- Dashboard Panel (Right) -->
  <g filter="url(#shadow)">
    <rect x="800" y="180" width="680" height="540" rx="24" fill="url(#panelGlass)" stroke="#334155" stroke-width="2"/>
  </g>
  <rect x="850" y="230" width="160" height="20" rx="10" fill="#e2e8f0"/>
  <rect x="850" y="260" width="120" height="10" rx="5" fill="#64748b"/>
  <circle cx="1420" cy="250" r="14" fill="url(#accentGradient)"/>

  <!-- ATS Score Ring -->
  <g transform="translate(1360 400)">
    <circle r="60" fill="none" stroke="#1e293b" stroke-width="14"/>
    <circle r="60" fill="none" stroke="url(#accentGradient)" stroke-width="14" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="30" transform="rotate(-90)"/>
    <text x="0" y="8" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700">92</text>
    <text x="0" y="30" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12">ATS SCORE</text>
  </g>

  <!-- Feature Checks -->
  <g font-family="Inter, system-ui, sans-serif" font-size="18" fill="#e2e8f0">
    <circle cx="880" cy="350" r="10" fill="#22c55e"/>
    <path d="M 875 350 l 4 4 l 8 -9" fill="none" stroke="#052e16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="356">ATS Keywords</text>
    <circle cx="880" cy="410" r="10" fill="#22c55e"/>
    <path d="M 875 410 l 4 4 l 8 -9" fill="none" stroke="#052e16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="416">Smart Summaries</text>
    <circle cx="880" cy="470" r="10" fill="#22c55e"/>
    <path d="M 875 470 l 4 4 l 8 -9" fill="none" stroke="#052e16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="476">Impact Metrics</text>
  </g>

  <!-- Growth Bars -->
  <g transform="translate(880 540)">
    <rect x="0" y="0" width="140" height="4" rx="2" fill="#1e293b"/>
    <rect x="0" y="0" width="100" height="4" rx="2" fill="url(#accentGradient)"/>
    <rect x="0" y="20" width="140" height="4" rx="2" fill="#1e293b"/>
    <rect x="0" y="20" width="130" height="4" rx="2" fill="#22d3ee"/>
    <rect x="0" y="40" width="140" height="4" rx="2" fill="#1e293b"/>
    <rect x="0" y="40" width="80" height="4" rx="2" fill="#a855f7"/>
  </g>
</svg>
